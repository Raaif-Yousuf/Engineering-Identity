# Column-name-only feature family map for the three canonical modeling
# tables (after/before/diff). No data values live here, only column names,
# so this file is safe to commit (see docs/data.md).
#
# Family key meanings:
#   demographics                      - Year/Major/Age/Gender + one-hot discipline
#   influences                        - who/what pushed the student toward engineering
#                                        (family members, curricular/social/etc. sources;
#                                        for 'before', also the program/school-choice block)
#   experiences_curricular_...        - curricular/co-curricular/extra-curricular
#                                        involvement (CIF) and hours-on-campus items
#   self_identification               - "I see myself as a(n) Engineer/Researcher/..."
#   career_achievements               - checklist of engineer "success" milestones
#                                        (PE exam, patents, recognition, salary, ...)
#   skills_self_assessment            - 'before' only: 26-item literacy/soft-skill
#                                        self-rating block, not present in 'after'/'diff'
#   definitions_ed                    - 15-keyword binary match against the "define an
#                                        engineer" free-response (paper's E-D metrics)
#   role_er                           - 15-keyword binary match against the "role of an
#                                        engineer" free-response (paper's E-R metrics)
#   keywords_skey                     - 15-keyword binary match against a third,
#                                        self-referential free-response (S-Key metrics)
#   concept_map                       - 15 keyword-presence-in-concept-map columns
#                                        ("(CM)") + 29 MATLAB concept-map complexity
#                                        metrics ("[Size]"/"[Inter Conn]"/etc.). Left-
#                                        joined from the 2026-09-19 OneDrive "+CM" dump
#                                        on Participant Code; NaN for participants whose
#                                        concept map has not been digitized (see
#                                        docs/data.md for coverage %).
#   identity_survey_LEAKAGE_RISK      - TARGET LEAKAGE RISK, do not use as model input
#                                        without care. These are the Recognition/
#                                        Interest/Performance items the paper describes
#                                        as the three dimensions the composite EI score
#                                        is built from. Empirically, a simple sum of
#                                        just these items already explains ~35% of the
#                                        target's variance (R^2=0.35 on 'after', naive
#                                        linear fit) -- far above any other single
#                                        family -- consistent with them being direct
#                                        components of 'ei' rather than merely
#                                        correlated with it. No exact (R^2=1.0)
#                                        reconstruction was found, so the composite is
#                                        not a simple visible sum/mean of these columns
#                                        alone; the full scoring formula was not located
#                                        in the source paper drafts. Treat this family as
#                                        excluded-by-default for any model meant to
#                                        *predict* EI from upstream factors.
