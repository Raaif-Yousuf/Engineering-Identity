# P3b: P3's features plus the before-semester ei score itself, predicting
# after ei -- a persistence ("nothing changed") baseline reported separately
# from P3, per the task spec.
# Deviation added mid-session (2026-09-20): lightgbm dropped from this
# config's models list. Trigger: P1's first dataset (p1_after, 1789 rows)
# showed xgboost and lightgbm both tuned in ~380s each after the
# nested-n_jobs fix (docs/experiments.md "Runtime stall"), and P1/P2 x 3
# variants + P3/P3b + P4 at that per-dataset cost projected past the ~4h
# wall-clock budget once crowd (now merged, real per-dataset cost) was
# added in. xgboost and lightgbm are both tuned gradient-boosted trees
# answering the same question, so lightgbm is cut here and in P2/P3/P3b;
# xgboost (already the importance_model) is kept. Not applied to P1,
# which had already started under the pre-cut config when this decision
# was made -- P1 keeps lightgbm for all 3 of its variants.
name: persistence_baseline
protocol: P3b
variants: [before_to_after]  # ignored by build_all(P3b); single joined dataset

models:
  - mean
  - ridge
  - elastic_net
  - random_forest
  - xgboost
  - original_ann
  - improved_ann
  - stacking
  - crowd

cv:
  n_splits: 5
  n_repeats: 5
  random_state: 42

ann_cv:
  n_splits: 5
  n_repeats: 1
  random_state: 42

improved_ann_n_seeds: 1

tuning:
  n_iter: 8
  inner_cv: 3

crowd_replications: 1
model_timeout_seconds: 1200

random_state: 42
paired_baseline: original_ann
importance_model: xgboost
results_dir: results
figures_dir: results/figures
notes: >
  Same joined cohort as P3, with one extra feature: the student's own before
  ei score ("ei_before"). This is a persistence baseline, not a genuine
  prediction task -- if this alone matches or beats P3's R^2, most of what
  P3's other features contribute is redundant with "the student already had
  a stable EI level at the start of the semester."
